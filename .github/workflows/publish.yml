# Publishes crates on version tags. Requires repo secret CARGO_REGISTRY_TOKEN.
name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  crates-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace
      - name: publish core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p reelforge-intelligence-core --locked
      - name: publish sightloom adapter
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          sleep 15
          cargo publish -p reelforge-intelligence-sightloom --locked
      - name: publish cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          sleep 15
          cargo publish -p reelforge-intelligence-cli --locked
