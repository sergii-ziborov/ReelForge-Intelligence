name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intelligence
    steps:
      - uses: actions/checkout@v4
        with:
          path: intelligence
      - name: checkout ReelForge sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/ReelForge
          ref: 466aa7b9feb3af2373b83106ad6319f20743c519
          path: ReelForge
      - name: checkout SightLoom sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/SightLoom
          ref: 8ee820909d943a69f0dad78df3bf755107a9c5cb
          path: SightLoom
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intelligence
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: bench compile
        run: cargo bench -p reelforge-intelligence-core --bench pipeline --no-run
      - name: cli smoke
        run: |
          cargo run -p reelforge-intelligence-cli -- version
          cargo run -p reelforge-intelligence-cli -- methods
          cargo run -p reelforge-intelligence-cli -- dispatch --method list_methods --args '{}'
